name: biometric_info
description: "Lecture des informations biométriques d'une carte (lecteur uTrust) et impression A4."
publish_to: 'none'
version: 1.2.5+10

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdf: ^3.11.1
  printing: ^5.13.2
  ffi: ^2.1.3
  win32: ^5.10.0
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  mrz_parser: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/tutorial/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon.png
  macos:
    generate: true
    image_path: assets/icon.png
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
