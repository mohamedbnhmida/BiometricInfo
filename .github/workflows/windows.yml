name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BiometricInfo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BiometricInfo-windows-x64
          path: BiometricInfo-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BiometricInfo-windows-x64.zip
          generate_release_notes: true
